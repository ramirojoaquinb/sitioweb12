<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Pilates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F4EF;
    --card: #FFFFFF;
    --accent: #4A5D46;
    --accent-soft: #DCE3D6;
    --text: #22261F;
    --text-dim: #837C70;
    --border: #E2DED2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }

  .card { width: 100%; max-width: 420px; }

  header { text-align: center; margin-bottom: 30px; }

  header h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1.7rem;
    margin: 0 0 6px;
    color: var(--accent);
  }

  header p { color: var(--text-dim); font-size: 0.95rem; margin: 0; }

  section { margin-bottom: 26px; }

  h2 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 12px;
  }

  .reserva {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
  }

  .clases {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .clases button {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.86rem;
    padding: 8px 16px;
    cursor: pointer;
  }

  .clases button.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .reserva label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .reserva input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    font-size: 1rem;
    padding: 10px 12px;
  }

  .reserva input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .reserva button.enviar {
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 13px;
    cursor: pointer;
  }

  .reserva button.enviar:hover { opacity: 0.9; }

  .horarios ul, .planes ul {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 0.93rem;
  }

  .horarios li {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding: 9px 0;
    color: var(--text-dim);
  }

  .horarios li span:last-child { color: var(--text); text-align: right; }

  .planes li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .planes li .nombre { font-weight: 500; }
  .planes li .detalle { display: block; font-size: 0.8rem; color: var(--text-dim); font-weight: 400; }
  .planes li .precio { color: var(--accent); font-weight: 600; white-space: nowrap; }

  .links { display: flex; flex-direction: column; gap: 10px; }

  .links a {
    display: block;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 13px;
    font-size: 0.95rem;
    background: var(--card);
  }

  .links a:hover { border-color: var(--accent); }

  footer { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 26px; }
</style>
</head>
<body>

<div class="card">
  <header>
    <h1 id="nombreNegocio">Nombre del Estudio</h1>
    <p id="tagline">Pilates reformer y mat, cupos reducidos</p>
  </header>

  <section class="reserva">
    <h2>Reservar una clase de prueba</h2>
    <div class="clases" id="clases"></div>
    <label for="preferencia">Día u horario que te quede bien (opcional)</label>
    <input type="text" id="preferencia" placeholder="Ej: lunes a la mañana">
    <button class="enviar" id="pedirClase">Reservar por WhatsApp</button>
  </section>

  <section class="horarios">
    <h2>Horarios</h2>
    <ul id="horarios"></ul>
  </section>

  <section class="planes">
    <h2>Planes</h2>
    <ul id="planes"></ul>
  </section>

  <section class="links">
    <a id="linkReseña" href="#" target="_blank">Dejar una reseña</a>
    <a id="linkInstagram" href="#" target="_blank">Instagram</a>
    <a id="linkWhatsapp" href="#" target="_blank">Escribinos por WhatsApp</a>
  </section>

  <footer>Powered by tarjeta NFC</footer>
</div>

<script>
  /* ======================================================
     CONFIGURACIÓN — Editar esto para cada cliente nuevo
     ====================================================== */
  const CONFIG = {
    nombreNegocio: "Nombre del Estudio",
    tagline: "Pilates reformer y mat, cupos reducidos",
    whatsappNumero: "5491112345678", // sin +, sin espacios, con código de país y de área
    reseñaGoogleUrl: "https://g.page/r/EJEMPLO/review",
    instagramUrl: "https://instagram.com/ejemplo",
    clases: ["Reformer", "Mat", "Individual"],
    horarios: [
      { dias: "Lun a Vie", horas: "8:00–12:00 / 17:00–21:00" },
      { dias: "Sábados", horas: "9:00–13:00" }
    ],
    planes: [
      { nombre: "Clase suelta", detalle: "Una clase, sin compromiso", precio: "$6.500" },
      { nombre: "Plan 8 clases", detalle: "2 veces por semana, mensual", precio: "$38.000" },
      { nombre: "Plan 12 clases", detalle: "3 veces por semana, mensual", precio: "$52.000" }
    ]
  };
  /* ====================================================== */

  document.getElementById('nombreNegocio').textContent = CONFIG.nombreNegocio;
  document.title = CONFIG.nombreNegocio;
  document.getElementById('tagline').textContent = CONFIG.tagline;
  document.getElementById('linkReseña').href = CONFIG.reseñaGoogleUrl;
  document.getElementById('linkInstagram').href = CONFIG.instagramUrl;
  document.getElementById('linkWhatsapp').href = `https://wa.me/${CONFIG.whatsappNumero}`;

  // Selector de tipo de clase
  let claseSeleccionada = null;
  const clasesDiv = document.getElementById('clases');
  CONFIG.clases.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c;
    btn.type = 'button';
    btn.addEventListener('click', () => {
      claseSeleccionada = c;
      [...clasesDiv.children].forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    clasesDiv.appendChild(btn);
  });

  // Horarios
  document.getElementById('horarios').innerHTML = CONFIG.horarios
    .map(h => `<li><span>${h.dias}</span><span>${h.horas}</span></li>`).join('');

  // Planes
  document.getElementById('planes').innerHTML = CONFIG.planes
    .map(p => `<li><span class="nombre">${p.nombre}<span class="detalle">${p.detalle}</span></span><span class="precio">${p.precio}</span></li>`)
    .join('');

  // Botón de reserva → arma el mensaje y abre WhatsApp
  document.getElementById('pedirClase').addEventListener('click', () => {
    const preferencia = document.getElementById('preferencia').value.trim();
    let mensaje = claseSeleccionada
      ? `Hola! Quiero reservar una clase de prueba de ${claseSeleccionada}.`
      : `Hola! Quiero reservar una clase de prueba.`;
    if (preferencia) mensaje += ` Me quedaría bien: ${preferencia}.`;

    const url = `https://wa.me/${CONFIG.whatsappNumero}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, '_blank');
  });
</script>

</body>
</html>
